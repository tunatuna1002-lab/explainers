<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사진마다 MCMC와 인코더</title>
<link rel="stylesheet" href="shim.css">
</head>
<body>
<h2 class="sr-only">사진마다 사후분포가 달라 MCMC는 처음부터 다시 걸어야 하지만 인코더는 한 번 계산으로 근사 분포를 내는 비교 위젯</h2>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px">
<button id="p0">사진 1</button><button id="p1">사진 2</button><button id="p2">사진 3</button>
</div>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:0 0 12px">
<div style="background:var(--surface-1);border-radius:var(--radius);padding:10px 14px"><div style="font-size:13px;color:var(--text-secondary)">MCMC 모델 계산 횟수</div><div id="cm" style="font-size:22px;font-weight:500">0</div></div>
<div style="background:var(--surface-1);border-radius:var(--radius);padding:10px 14px"><div style="font-size:13px;color:var(--text-secondary)">예열 걸음 (언덕 도착까지)</div><div id="cb" style="font-size:22px;font-weight:500">-</div></div>
<div style="background:var(--surface-1);border-radius:var(--radius);padding:10px 14px"><div style="font-size:13px;color:var(--text-secondary)">인코더 계산 횟수</div><div id="ce" style="font-size:22px;font-weight:500">0</div></div>
</div>
<svg id="pl" width="100%" viewBox="0 0 680 260" role="img" aria-label="사진별 사후분포, MCMC 발자국, 인코더 근사 분포"></svg>
<div style="display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--text-secondary);margin:4px 0 12px">
<span><span style="display:inline-block;width:14px;height:2px;background:#D85A30;margin:0 6px 4px 0"></span>이 사진의 사후분포 (예시)</span>
<span><span style="display:inline-block;width:10px;height:10px;background:#B4B2A9;margin-right:6px"></span>예열 발자국 (버림)</span>
<span><span style="display:inline-block;width:10px;height:10px;background:#7F77DD;opacity:.6;margin-right:6px"></span>쓰는 발자국</span>
<span><span style="display:inline-block;width:14px;height:0;border-top:2px dashed #1D9E75;margin:0 6px 4px 0"></span>인코더 근사 (가우시안)</span>
</div>
<div style="display:flex;gap:8px;flex-wrap:wrap">
<button id="rm">MCMC로 300걸음</button><button id="re">인코더로 한 번에</button>
</div>
<div style="background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:12px 16px;margin:14px 0 0">
<div style="font-size:13px;color:var(--text-secondary)">지금 보고 있는 것</div>
<div id="nw" style="font-size:15px;line-height:1.6">-</div>
</div>
<script>
(function(){
var X0=-4,X1=4,PL=40,PR=640,TOP=30,BASE=210,NB=40,STEP=0.7;
var PH=[{b:[[1,-1.5,0.5]],e:[-1.5,0.5]},{b:[[1,2.0,0.6]],e:[2.0,0.6]},{b:[[0.55,-0.5,0.45],[0.45,2.5,0.5]],e:[0.9,1.4]}];
var ph=0,x,n,burn,bins,binsB,calls,enc,shown,running=false,tot=0;
var pl=document.getElementById('pl');
function p(v){var s=0;PH[ph].b.forEach(function(c){s+=c[0]*Math.exp(-Math.pow(v-c[1],2)/(2*c[2]*c[2]))/c[2]});return s}
function Z(){var z=0,i;for(i=0;i<1000;i++){z+=p(X0+(X1-X0)*(i+0.5)/1000)*(X1-X0)/1000}return z}
var maxP;
function sx(v){return PL+(v-X0)/(X1-X0)*(PR-PL)}
function nrm(){var u=Math.max(Math.random(),1e-9),v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(6.2832*v)}
function reset(){x=-3.6;n=0;burn=-1;bins=new Array(NB).fill(0);binsB=new Array(NB).fill(0);calls=0;enc=0;shown=false;var m=0,i;for(i=0;i<400;i++)m=Math.max(m,p(X0+(X1-X0)*i/400));maxP=m;draw()}
function step(){var xp=x+STEP*nrm();calls++;if(xp>X0&&xp<X1&&Math.random()<Math.min(1,p(xp)/p(x)))x=xp;n++;if(burn<0&&p(x)>0.5*maxP)burn=n;var b=Math.floor((x-X0)/(X1-X0)*NB);if(b>=0&&b<NB){if(burn<0)binsB[b]++;else bins[b]++}}
function draw(){
var z=Z(),maxD=0.9,ys=(BASE-TOP)/maxD,bw=(X1-X0)/NB,h='',i;
h+='<line x1="'+PL+'" y1="'+BASE+'" x2="'+PR+'" y2="'+BASE+'" stroke="var(--border-strong)" stroke-width="0.5"/>';
for(i=-4;i<=4;i+=2)h+='<text x="'+sx(i)+'" y="'+(BASE+18)+'" text-anchor="middle" style="font-size:12px;fill:var(--text-secondary)">'+i+'</text>';
if(n>0)for(i=0;i<NB;i++){var hb=Math.min(binsB[i]/(n*bw),maxD)*ys,hu=Math.min(bins[i]/(n*bw),maxD)*ys,xx=(sx(X0+i*bw)+0.5).toFixed(1),ww=((PR-PL)/NB-1).toFixed(1);
if(hb>0)h+='<rect x="'+xx+'" y="'+(BASE-hb).toFixed(1)+'" width="'+ww+'" height="'+hb.toFixed(1)+'" fill="#B4B2A9"/>';
if(hu>0)h+='<rect x="'+xx+'" y="'+(BASE-hb-hu).toFixed(1)+'" width="'+ww+'" height="'+hu.toFixed(1)+'" fill="#7F77DD" opacity="0.6"/>'}
var pts=[];for(i=0;i<=200;i++){var c=X0+(X1-X0)*i/200;pts.push(sx(c).toFixed(1)+','+(BASE-Math.min(p(c)/z,maxD)*ys).toFixed(1))}
h+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="#D85A30" stroke-width="2"/>';
if(shown){var m=PH[ph].e[0],s=PH[ph].e[1],q=[];for(i=0;i<=200;i++){var c2=X0+(X1-X0)*i/200,dv=Math.exp(-Math.pow(c2-m,2)/(2*s*s))/(s*2.5066);q.push(sx(c2).toFixed(1)+','+(BASE-Math.min(dv,maxD)*ys).toFixed(1))}
h+='<polyline points="'+q.join(' ')+'" fill="none" stroke="#1D9E75" stroke-width="2" stroke-dasharray="6 4"/>'}
if(n>0)h+='<circle cx="'+sx(x).toFixed(1)+'" cy="'+(BASE+34)+'" r="7" fill="var(--text-primary)"/>';
pl.innerHTML=h;
document.getElementById('cm').textContent=calls.toLocaleString();
document.getElementById('cb').textContent=burn<0?(n?'아직 도착 전':'-'):burn+'걸음';
document.getElementById('ce').textContent=enc;
[0,1,2].forEach(function(k){var b=document.getElementById('p'+k),on=k===ph;b.style.background=on?'var(--bg-accent)':'';b.style.color=on?'var(--text-accent)':'';b.setAttribute('aria-pressed',on)});
var t;
if(running)t='등산객이 사진 '+(ph+1)+'의 지도를 처음부터 걷고 있습니다. 회색 발자국은 언덕에 도착하기 전이라 버립니다.';
else if(n===0&&!shown)t='사진 '+(ph+1)+'의 지도입니다. 사진을 바꾸면 이전 발자국과 계산 횟수가 모두 사라지고 처음부터 시작합니다.';
else if(ph===2&&shown)t='인코더는 한 번 계산으로 분포를 내지만, 가우시안 하나라서 언덕 두 개를 정확히 따라가지 못합니다. 빠른 대신 근사입니다.';
else if(n>0&&shown)t='MCMC는 모델을 '+calls+'번 계산했고, 인코더는 1번 계산했습니다. 다른 사진으로 바꾸면 MCMC는 이 걸음을 다시 해야 합니다.';
else if(n>0)t='모델을 '+calls+'번 계산해서 이 사진 하나의 발자국을 모았습니다. 다른 사진에는 이 발자국을 쓸 수 없습니다.';
else t='인코더가 사진을 보고 평균과 흩어짐을 한 번에 냈습니다. 예열도, 반복 걸음도 없습니다.';
document.getElementById('nw').textContent=t}
function runAnim(){if(running)return;running=true;tot=0;(function f(){for(var j=0;j<3&&tot<300;j++){step();tot++}draw();if(tot<300)requestAnimationFrame(f);else{running=false;draw()}})()}
[0,1,2].forEach(function(k){document.getElementById('p'+k).onclick=function(){if(running)return;ph=k;reset()}});
document.getElementById('rm').onclick=runAnim;
document.getElementById('re').onclick=function(){if(!shown){enc=1;shown=true}draw()};
reset();
})();
</script>
<script src="shim.js"></script>
</body>
</html>
