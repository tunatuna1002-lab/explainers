<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>언덕 오르기와 MCMC</title>
<link rel="stylesheet" href="shim.css">
</head>
<body>
<h2 class="sr-only">같은 두 언덕 분포에서 내려가는 걸음을 받지 않는 언덕 오르기와 가끔 받아들이는 MCMC의 발자국 차이를 비교하는 위젯</h2>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px">
<button id="mh">언덕 오르기 (최적화)</button><button id="mm">MCMC (샘플링)</button>
</div>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:0 0 12px">
<div style="background:var(--surface-1);border-radius:var(--radius);padding:10px 14px"><div style="font-size:13px;color:var(--text-secondary)">걸음 수</div><div id="cn" style="font-size:22px;font-weight:500">0</div></div>
<div style="background:var(--surface-1);border-radius:var(--radius);padding:10px 14px"><div style="font-size:13px;color:var(--text-secondary)">내려간 걸음 수</div><div id="cd" style="font-size:22px;font-weight:500">0</div></div>
<div style="background:var(--surface-1);border-radius:var(--radius);padding:10px 14px"><div style="font-size:13px;color:var(--text-secondary)">지금 위치</div><div id="cx" style="font-size:22px;font-weight:500">-3.50</div></div>
</div>
<svg id="pl" width="100%" viewBox="0 0 680 260" role="img" aria-label="목표 분포 곡선과 발자국 막대그래프"></svg>
<div style="display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--text-secondary);margin:4px 0 12px">
<span><span style="display:inline-block;width:14px;height:2px;background:#D85A30;margin:0 6px 4px 0"></span>목표 분포 (예시)</span>
<span><span style="display:inline-block;width:10px;height:10px;background:#7F77DD;opacity:.6;margin-right:6px"></span>발자국 막대</span>
<span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--text-primary);margin-right:6px"></span>지금 위치</span>
</div>
<div style="display:flex;gap:8px;flex-wrap:wrap">
<button id="b100">100걸음</button><button id="b1k">1000걸음</button><button id="br">처음부터</button>
</div>
<div style="background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:12px 16px;margin:14px 0 0">
<div style="font-size:13px;color:var(--text-secondary)">지금 보고 있는 것</div>
<div id="nw" style="font-size:15px;line-height:1.6">-</div>
</div>
<script>
(function(){
var X0=-4,X1=4,PL=40,PR=640,TOP=30,BASE=210,NB=40,STEP=0.8,i;
function p(x){return 0.6*Math.exp(-Math.pow(x+1.5,2)/(2*0.36))+0.4*Math.exp(-Math.pow(x-1.8,2)/(2*0.64))}
var Z=0;for(i=0;i<2000;i++){var gx=X0+(X1-X0)*(i+0.5)/2000;Z+=p(gx)*(X1-X0)/2000}
var mode='mcmc',x,n,down,bins,pl=document.getElementById('pl');
function sx(v){return PL+(v-X0)/(X1-X0)*(PR-PL)}
function nrm(){var u=Math.max(Math.random(),1e-9),v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(6.2832*v)}
function reset(){x=-3.5;n=0;down=0;bins=new Array(NB).fill(0);draw()}
function step(){var xp=x+STEP*nrm();if(xp>X0&&xp<X1){var r=p(xp)/p(x),ok=mode==='mcmc'?Math.random()<Math.min(1,r):r>=1;if(ok){if(r<1)down++;x=xp}}
n++;var b=Math.floor((x-X0)/(X1-X0)*NB);if(b>=0&&b<NB)bins[b]++}
function draw(){
var maxD=0.6,ys=(BASE-TOP)/maxD,bw=(X1-X0)/NB,h='';
h+='<line x1="'+PL+'" y1="'+BASE+'" x2="'+PR+'" y2="'+BASE+'" stroke="var(--border-strong)" stroke-width="0.5"/>';
for(i=-4;i<=4;i+=2)h+='<text x="'+sx(i)+'" y="'+(BASE+18)+'" text-anchor="middle" style="font-size:12px;fill:var(--text-secondary)">'+i+'</text>';
if(n>0)for(i=0;i<NB;i++){var d=bins[i]/(n*bw),hh=Math.min(d,maxD)*ys;if(hh>0)h+='<rect x="'+(sx(X0+i*bw)+0.5).toFixed(1)+'" y="'+(BASE-hh).toFixed(1)+'" width="'+((PR-PL)/NB-1).toFixed(1)+'" height="'+hh.toFixed(1)+'" fill="#7F77DD" opacity="0.55"/>'}
var pts=[];for(i=0;i<=200;i++){var c=X0+(X1-X0)*i/200;pts.push(sx(c).toFixed(1)+','+(BASE-p(c)/Z*ys).toFixed(1))}
h+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="#D85A30" stroke-width="2"/>';
h+='<circle cx="'+sx(x).toFixed(1)+'" cy="'+(BASE+34)+'" r="7" fill="var(--text-primary)"/>';
pl.innerHTML=h;
document.getElementById('cn').textContent=n.toLocaleString();
document.getElementById('cd').textContent=down.toLocaleString();
document.getElementById('cx').textContent=x.toFixed(2);
['mh','mm'].forEach(function(id){var on=(id==='mh')===(mode==='hill'),b=document.getElementById(id);b.style.background=on?'var(--bg-accent)':'';b.style.color=on?'var(--text-accent)':'';b.setAttribute('aria-pressed',on)});
var t;
if(n===0)t=mode==='hill'?'언덕 오르기 모드입니다. 내려가는 제안은 모두 거절합니다. 버튼을 눌러 걸어 보십시오.':'MCMC 모드입니다. 내려가는 제안도 높이 비율만큼 받아들입니다. 버튼을 눌러 걸어 보십시오.';
else if(mode==='hill')t='한 번도 내려가지 않아서 왼쪽 정상 근처에 갇혔습니다. 발자국이 한곳에 몰려 언덕 모양을 닮지 않습니다.';
else if(n<300)t='가끔 내려가며 돌아다니기 시작했습니다. 걸음을 더 쌓아 보십시오.';
else t=''+down.toLocaleString()+'번 내려간 덕분에 두 언덕을 모두 오가며, 발자국이 언덕 모양 전체를 닮아 갑니다.';
document.getElementById('nw').textContent=t}
function run(k){for(var j=0;j<k;j++)step();draw()}
document.getElementById('mh').onclick=function(){mode='hill';reset()};
document.getElementById('mm').onclick=function(){mode='mcmc';reset()};
document.getElementById('b100').onclick=function(){run(100)};
document.getElementById('b1k').onclick=function(){run(1000)};
document.getElementById('br').onclick=reset;
reset();
})();
</script>
<script src="shim.js"></script>
</body>
</html>
