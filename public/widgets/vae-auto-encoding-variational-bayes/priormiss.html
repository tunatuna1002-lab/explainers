<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사전 샘플이 빗나감</title>
<link rel="stylesheet" href="shim.css">
</head>
<body>
<h2 class="sr-only">사전분포에서 뽑은 샘플 대부분이 좁은 사후분포 영역을 빗나가는 모습과 20차원에서의 적중 확률 추정</h2>
<div style="display:flex;align-items:center;gap:12px;margin:0 0 14px;flex-wrap:wrap">
<label for="rr" style="font-size:14px;color:var(--text-secondary)">사후분포 영역 반지름</label>
<input type="range" id="rr" min="0.05" max="1.5" step="0.05" value="0.3" style="flex:1;min-width:140px">
<span id="rro" style="font-size:14px;font-weight:500;min-width:36px;text-align:right">0.30</span>
</div>
<div style="display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start">
<svg id="pl" width="280" height="280" viewBox="0 0 280 280" role="img" aria-label="사전분포 샘플 점과 사후분포 영역 원" style="flex:0 0 auto;max-width:100%"></svg>
<div style="flex:1;min-width:200px;display:grid;gap:10px">
<div style="background:var(--surface-1);border-radius:var(--radius);padding:10px 14px"><div style="font-size:13px;color:var(--text-secondary)">보이는 300개 중 적중</div><div id="mh" style="font-size:22px;font-weight:500">-</div></div>
<div style="background:var(--surface-1);border-radius:var(--radius);padding:10px 14px"><div style="font-size:13px;color:var(--text-secondary)">2차원 적중 확률 (2만 개로 어림)</div><div id="m2" style="font-size:22px;font-weight:500">-</div></div>
<div style="background:var(--surface-1);border-radius:var(--radius);padding:10px 14px"><div style="font-size:13px;color:var(--text-secondary)">20차원이면 (가정: 2차원 묶음 10개가 독립)</div><div id="m20" style="font-size:22px;font-weight:500">-</div></div>
</div>
</div>
<div style="display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--text-secondary);margin:8px 0 0">
<span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#B4B2A9;margin-right:6px"></span>빗나간 샘플</span>
<span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#1D9E75;margin-right:6px"></span>적중한 샘플</span>
<span><span style="display:inline-block;width:14px;height:0;border-top:1.5px solid #1D9E75;margin:0 6px 4px 0"></span>사후분포 영역 (예시)</span>
</div>
<div style="background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:12px 16px;margin:14px 0 0">
<div style="font-size:13px;color:var(--text-secondary)">지금 보고 있는 것</div>
<div id="nw" style="font-size:15px;line-height:1.6">-</div>
</div>
<script>
(function(){
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var r=rng(11),S=[],i;
function g(){var u=Math.max(r(),1e-9),v=r(),m=Math.sqrt(-2*Math.log(u));return[m*Math.cos(6.2832*v),m*Math.sin(6.2832*v)]}
for(i=0;i<20000;i++)S.push(g());
var CX=1.2,CY=-0.8,sl=document.getElementById('rr'),pl=document.getElementById('pl');
function px(v){return 140+v*42}function py(v){return 140-v*42}
function sci(p){if(p<=0)return '측정 불가할 만큼 작음';if(p>=0.001)return (p*100).toFixed(2)+'%';var e=Math.floor(Math.log10(p)),m=p/Math.pow(10,e);return m.toFixed(1)+' × 10<sup>'+e+'</sup>'}
function draw(){
var rad=+sl.value,h='',hit=0,all=0;
document.getElementById('rro').textContent=rad.toFixed(2);
h+='<rect x="0.5" y="0.5" width="279" height="279" rx="8" fill="none" stroke="var(--border)" stroke-width="0.5"/>';
h+='<line x1="14" y1="140" x2="266" y2="140" stroke="var(--border-strong)" stroke-width="0.5"/><line x1="140" y1="14" x2="140" y2="266" stroke="var(--border-strong)" stroke-width="0.5"/>';
for(i=0;i<300;i++){var a=S[i],ins=Math.pow(a[0]-CX,2)+Math.pow(a[1]-CY,2)<=rad*rad;if(ins)hit++;
if(a[0]>-3.2&&a[0]<3.2&&a[1]>-3.2&&a[1]<3.2)h+='<circle cx="'+px(a[0]).toFixed(1)+'" cy="'+py(a[1]).toFixed(1)+'" r="'+(ins?3.5:2.2)+'" fill="'+(ins?'#1D9E75':'#B4B2A9')+'" opacity="'+(ins?1:0.7)+'"/>'}
h+='<circle cx="'+px(CX)+'" cy="'+py(CY)+'" r="'+(rad*42).toFixed(1)+'" fill="#1D9E75" fill-opacity="0.12" stroke="#1D9E75" stroke-width="1.5"/>';
pl.innerHTML=h;
for(i=0;i<20000;i++){if(Math.pow(S[i][0]-CX,2)+Math.pow(S[i][1]-CY,2)<=rad*rad)all++}
var p2=all/20000,p20=Math.pow(p2,10);
document.getElementById('mh').textContent=hit+'개';
document.getElementById('m2').innerHTML=all?sci(p2):'2만 개 중 0개';
document.getElementById('m20').innerHTML=all?sci(p20):'측정 불가할 만큼 작음';
var t;
if(p2>0.2)t='영역이 넓어서 샘플이 꽤 적중합니다. 하지만 실제 사후분포는 보통 이보다 훨씬 좁습니다.';
else if(all>0)t='300개 중 '+hit+'개만 적중합니다. 20차원으로 늘리면 적중 확률이 '+(p20<1e-6?'사실상 0':'아주 작은 값')+'이 되어, 평균이 0에 가까운 값들로만 채워집니다.';
else t='영역이 너무 좁아서 2만 개를 뽑아도 하나도 적중하지 않습니다. 이 어림값은 0이 되어 쓸모가 없습니다.';
document.getElementById('nw').textContent=t}
sl.addEventListener('input',draw);draw();
})();
</script>
<script src="shim.js"></script>
</body>
</html>
