<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>흩어짐과 재구성</title>
<link rel="stylesheet" href="shim.css">
</head>
<body>
<h2 class="sr-only">흩어짐 슬라이더를 움직이면 잠재 공간의 점 구름과 다시 그린 얼굴이 함께 변하는 장난감 예시</h2>
<div style="display:flex;align-items:center;gap:12px;margin:0 0 6px;flex-wrap:wrap">
<label for="sg" style="font-size:14px;color:var(--text-secondary)">흩어짐 (sigma)</label>
<input type="range" id="sg" min="0.1" max="2" step="0.1" value="0.5" style="flex:1;min-width:160px">
<span id="sgo" style="font-size:14px;font-weight:500;min-width:28px;text-align:right">0.5</span>
<button id="rr">주사위 다시 던지기</button>
</div>
<p style="font-size:13px;color:var(--text-secondary);margin:0 0 14px">스케치 후보 = 평균 스케치 + 흩어짐 × 표준 주사위</p>
<div style="display:flex;flex-wrap:wrap;gap:12px">
<div style="flex:1;min-width:200px;background:var(--surface-1);border-radius:12px;padding:10px;text-align:center">
<div style="font-size:13px;color:var(--text-secondary);margin-bottom:4px">스케치 후보 구름 (잠재 공간)</div>
<svg id="cl" width="200" height="200" viewBox="0 0 200 200" role="img" aria-label="평균 주변에 흩어진 스케치 후보 점들"></svg>
</div>
<div style="flex:1;min-width:200px;background:var(--surface-1);border-radius:12px;padding:10px;text-align:center">
<div style="font-size:13px;color:var(--text-secondary);margin-bottom:4px">원본 그림</div>
<svg width="200" height="200" viewBox="0 0 200 200" role="img" aria-label="원본 얼굴 그림"><g fill="none" stroke="var(--text-primary)" stroke-width="2.5" stroke-linecap="round"><ellipse cx="100" cy="100" rx="62" ry="70"/><circle cx="78" cy="85" r="7"/><circle cx="122" cy="85" r="7"/><path d="M72 128Q100 142 128 128"/></g></svg>
</div>
<div style="flex:1;min-width:200px;background:var(--surface-1);border-radius:12px;padding:10px;text-align:center">
<div style="font-size:13px;color:var(--text-secondary);margin-bottom:4px">다시 그린 그림 겹쳐 보기</div>
<svg id="ov" width="200" height="200" viewBox="0 0 200 200" role="img" aria-label="여러 스케치 후보로 다시 그린 얼굴을 겹친 그림"></svg>
</div>
</div>
<div style="font-size:13px;color:var(--text-secondary);margin:14px 0 4px">진한 점으로 다시 그린 그림</div>
<div id="rw" style="display:flex;gap:8px;flex-wrap:wrap"></div>
<div style="display:flex;align-items:center;gap:12px;margin:14px 0 0">
<span style="font-size:13px;color:var(--text-secondary);white-space:nowrap">원본과 비슷한 정도</span>
<div style="flex:1;height:10px;background:var(--surface-1);border-radius:5px;overflow:hidden"><div id="br" style="height:10px;width:60%;background:#1D9E75;border-radius:5px"></div></div>
<span id="bw" style="font-size:14px;font-weight:500;min-width:64px;text-align:right">비슷함</span>
</div>
<div style="font-size:12px;color:var(--text-muted);margin:2px 0 0">장난감 점수 (논문 밖, 예시)</div>
<div style="background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:12px 16px;margin:14px 0 0">
<div style="font-size:13px;color:var(--text-secondary)">지금 보고 있는 것</div>
<div id="nw" style="font-size:15px;color:var(--text-primary);line-height:1.6">스케치 후보가 조금 퍼져서, 다시 그린 얼굴의 입과 눈이 조금씩 달라집니다.</div>
</div>
<div style="display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--text-secondary);margin:12px 0 0">
<span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#7F77DD;margin-right:6px"></span>스케치 후보 z</span>
<span><span style="display:inline-block;width:10px;height:2px;background:var(--text-primary);margin:0 6px 4px 0"></span>평균 스케치 (십자)</span>
<span><span style="display:inline-block;width:10px;height:0;border-top:1.5px dashed #7F77DD;margin:0 6px 4px 0"></span>흩어짐 범위</span>
<span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#1D9E75;margin-right:6px"></span>다시 그린 그림</span>
</div>
<script>
(function(){
var seed=7,eps=[];
var sl=document.getElementById('sg'),out=document.getElementById('sgo'),cl=document.getElementById('cl'),ov=document.getElementById('ov'),rw=document.getElementById('rw'),br=document.getElementById('br'),bw=document.getElementById('bw'),nw=document.getElementById('nw');
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function roll(){var r=rng(seed);eps=[];while(eps.length<60){var u=Math.max(r(),1e-9),v=r(),m=Math.sqrt(-2*Math.log(u)),a=m*Math.cos(6.2832*v),b=m*Math.sin(6.2832*v);if(Math.abs(a)<2.4&&Math.abs(b)<2.4)eps.push([a,b])}}
function lim(x,lo,hi){return Math.max(lo,Math.min(hi,x))}
function face(d1,d2,col,op,sw){var rx=lim(62+3*d2,48,76),er=lim(7+2*d2,2,14),c=lim(14+9*d1,-26,40);return '<g fill="none" stroke="'+col+'" stroke-width="'+sw+'" opacity="'+op+'" stroke-linecap="round"><ellipse cx="100" cy="100" rx="'+rx.toFixed(1)+'" ry="70"/><circle cx="78" cy="85" r="'+er.toFixed(1)+'"/><circle cx="122" cy="85" r="'+er.toFixed(1)+'"/><path d="M72 128Q100 '+(128+c).toFixed(1)+' 128 128"/></g>'}
function draw(){
var s=parseFloat(sl.value),k=18,h='',i,e;
out.textContent=s.toFixed(1);
h+='<line x1="10" y1="100" x2="190" y2="100" stroke="var(--border-strong)" stroke-width="0.5"/><line x1="100" y1="10" x2="100" y2="190" stroke="var(--border-strong)" stroke-width="0.5"/>';
h+='<circle cx="100" cy="100" r="'+(2*s*k).toFixed(1)+'" fill="none" stroke="#7F77DD" stroke-width="1" stroke-dasharray="3 3"/>';
for(i=59;i>=0;i--){e=eps[i];var x=(100+k*s*e[0]).toFixed(1),y=(100-k*s*e[1]).toFixed(1);
if(i<5)h+='<circle cx="'+x+'" cy="'+y+'" r="4" fill="#534AB7" stroke="var(--text-primary)" stroke-width="1"/>';
else h+='<circle cx="'+x+'" cy="'+y+'" r="2.5" fill="#7F77DD" opacity="0.5"/>';}
h+='<line x1="93" y1="100" x2="107" y2="100" stroke="var(--text-primary)" stroke-width="1.5"/><line x1="100" y1="93" x2="100" y2="107" stroke="var(--text-primary)" stroke-width="1.5"/>';
cl.innerHTML=h;
var o='',sum=0;
for(i=0;i<30;i++){e=eps[i];o+=face(s*e[0],s*e[1],'#1D9E75',0.1,2.5);sum+=Math.exp(-(Math.abs(s*e[0])+Math.abs(s*e[1]))/2);}
ov.innerHTML=o;
var r='';
for(i=0;i<5;i++){e=eps[i];r+='<div style="background:var(--surface-1);border-radius:8px;padding:4px"><svg width="88" height="88" viewBox="0 0 200 200" role="img" aria-label="다시 그린 얼굴">'+face(s*e[0],s*e[1],'#1D9E75',1,5)+'</svg></div>';}
rw.innerHTML=r;
var sim=sum/30;
br.style.width=Math.round(sim*100)+'%';
bw.textContent=sim>0.8?'거의 같음':sim>0.6?'비슷함':sim>0.4?'꽤 다름':'많이 다름';
nw.textContent=s<=0.4?'흩어짐이 작아서 스케치 후보가 평균 가까이에 모이고, 다시 그린 얼굴이 원본과 거의 같습니다.':s<=0.9?'스케치 후보가 조금 퍼져서, 다시 그린 얼굴의 입과 눈이 조금씩 달라집니다.':s<=1.4?'스케치 후보가 넓게 퍼져서, 다시 그린 얼굴이 원본과 눈에 띄게 달라집니다.':'스케치 후보가 아주 넓게 퍼져서, 다시 그린 얼굴이 제각각이고 겹친 그림이 흐려집니다.';
}
sl.addEventListener('input',draw);
document.getElementById('rr').addEventListener('click',function(){seed+=1;roll();draw()});
roll();draw();
})();
</script>
<script src="shim.js"></script>
</body>
</html>
