<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>하한 L의 위치</title>
<link rel="stylesheet" href="shim.css">
</head>
<body>
<div class="card"><svg width="100%" viewBox="0 0 680 230" role="img"><title>하한 L, 로그 주변우도, 0의 순서</title><desc>수직선 위에 왼쪽부터 하한 L, 로그 주변우도 log p(x), 0이 놓여 있고, L과 log p(x) 사이 간격은 KL, log p(x)와 0 사이 간격은 확률이 1보다 작아서 생기는 간격이다. 경사상승법은 L을 오른쪽으로 민다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="ts" x="60" y="36" dominant-baseline="central">작은 값 쪽</text>
<text class="ts" x="620" y="36" text-anchor="end" dominant-baseline="central">큰 값 쪽</text>
<line x1="60" y1="110" x2="630" y2="110" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><circle cx="220" cy="110" r="9" stroke-width="0.5"/></g>
<g class="c-coral"><circle cx="400" cy="110" r="9" stroke-width="0.5"/></g>
<g class="c-gray"><circle cx="580" cy="110" r="9" stroke-width="0.5"/></g>
<text class="th" x="220" y="80" text-anchor="middle" dominant-baseline="central">하한 L</text>
<text class="th" x="400" y="80" text-anchor="middle" dominant-baseline="central">log p(x)</text>
<text class="th" x="580" y="80" text-anchor="middle" dominant-baseline="central">0</text>
<path d="M226 150 L226 160 L394 160 L394 150" fill="none" stroke="#7F77DD" stroke-width="1"/>
<text class="ts" x="310" y="182" text-anchor="middle" dominant-baseline="central">간격 = KL (0 이상)</text>
<path d="M406 150 L406 160 L574 160 L574 150" fill="none" stroke="#888780" stroke-width="1"/>
<text class="ts" x="490" y="182" text-anchor="middle" dominant-baseline="central">확률이 1 이하라서 생김</text>
<line x1="160" y1="210" x2="300" y2="210" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="320" y="210" dominant-baseline="central">경사상승법은 L을 오른쪽으로 밉니다</text>
</svg></div>
<script src="shim.js"></script>
</body>
</html>
